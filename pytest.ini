[pytest]

# Register custom test markers
markers =
    smoke: critical tests that verify the main API functionality
    regression: complete API regression test suite
    auth: authentication and authorization tests
    request: request payload and input validation tests
    response: response structure, headers and data type tests

# Display logs directly in the terminal
log_cli = true
log_cli_level = INFO

# Save test logs to a file
log_file = logs/api_test.log
log_file_level = INFO

# Define the log format
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s

# Define the log timestamp format
log_date_format = %Y-%m-%d %I:%M:%S %p